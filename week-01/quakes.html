<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="quake-count">    </p>
    <script>
    const quakeCount=document.getElementById("quake-count").textContent="加载中...";
    fetch("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson")
    .then(
        function(response){
            return response.json();
        }
    )
    .then(function(data){
        data.features.length;
        const count=data.features.length;
        document.getElementById("quake-count").textContent="地震点位数："+count;
        console.log("[0]", count);
        }
    )
    .catch(
        function(error){
            document.getElementById("quake-count").textContent="加载失败";
            console.log("[1]", error);
        }
    );
    </script>
</body>
</html>
