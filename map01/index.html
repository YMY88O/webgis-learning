<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一张空白地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map("map").setView([42.8,129.8],13);
        console.log("[1]",map.getZoom())
        var baseUrl ="https://t0.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=a62494c005d8b30b87dfef2209f005d1";
        const baseLayer=L.tileLayer(baseUrl,{attribution: "底图：天地图（国家地理信息公共服务平台）"});
        baseLayer.addTo(map);
        const imgUrl ="https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=a62494c005d8b30b87dfef2209f005d1";
    const imgLayer= L.tileLayer(imgUrl,{attribution: "注记：天地图（国家地理信息公共服务平台）"}).addTo(map);
    const baseMaps={
    "矢量底          图":baseLayer,
        "影像底图":imgLayer
    };
    L.control.layers(baseMaps).addTo(map);
console.log("[3]",map.getZoom ());
        const marker=L.marker([42.8,129.8]).addTo(map)
        const popupText="图们市（练习点位）"
        marker.bindPopup(popupText);
        console.log("[2]",popupText);
        </script>
</body>
</html>
